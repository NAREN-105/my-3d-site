<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive 3D Model</title>
    <style>
        body { margin: 0; background-color: #0d0d11; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .loading-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 1.5rem; letter-spacing: 2px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-text">LOADING 3D MODEL...</div>
    <div id="canvas-container"></div>

    <!-- Load Three.js core and the glTF extension loaders -->
    <script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>


    <script>
        // Setup the baseline WebGL Scene environments
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8); // Move camera back so large models fit on screen

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Enhances texture details
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Add balanced lighting layers to properly illuminate the textures folder images
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
        fillLight.position.set(-5, -5, -2);
        scene.add(fillLight);

        // Load the model directly from your raw GitHub Pages link
        const loader = new THREE.GLTFLoader();
        let model;
        
        // This targets your exact uploaded scene.gltf file
        const modelPath = 'https://github.io';

        loader.load(modelPath, function (gltf) {
            model = gltf.scene;
            scene.add(model);
            
            // Hide the loading text once complete
            document.getElementById('loading').style.display = 'none';
            
            // Auto-center the imported object bounds inside the viewport camera
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);
        }, undefined, function (error) {
            console.error('Error loading glTF layout:', error);
            document.getElementById('loading').innerText = 'Failed to load 3D asset.';
        });

        // Track the mouse cursor path coordinates
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (event) => {
            targetX = (event.clientX / window.innerWidth) - 0.5;
            targetY = (event.clientY / window.innerHeight) - 0.5;
        });

        // Animation update loop frame sequence
        function animate() {
            requestAnimationFrame(animate);
            
            // Smoothly rotate the asset towards the user's cursor orientation
            if (model) {
                model.rotation.y += (targetX * 2.5 - model.rotation.y) * 0.05;
                model.rotation.x += (targetY * 2.5 - model.rotation.x) * 0.05;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // Manage responsive window reshaping
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
